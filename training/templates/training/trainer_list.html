{% extends "training/base.html" %}
{% block title %}Trainers{% endblock %}

{% block content %}
  <style>
    .trainer-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:12px;
      border:1px solid var(--border);
      border-radius:14px;
      background: var(--input-bg);
    }
    .trainer-left{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0;
    }
    .trainer-name{
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 640px;
    }
    .trainer-meta{
      font-size:13px;
      color: var(--muted);
    }
    @media (max-width: 820px){
      .trainer-name{ max-width: 100%; }
    }
  </style>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">
      <div>
        <h1 style="margin:0 0 6px;">Trainers</h1>
        <p class="help" style="margin:0;">Search by name, email, or SYSPER ID. Results update as you type.</p>
      </div>

      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <a class="btn secondary" href="{% url 'calendar' %}">Calendar</a>
        <a class="btn secondary" href="{% url 'training_list' %}">Trainings</a>
      </div>
    </div>

    <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--border);">
      <div class="form-row" style="max-width:520px;">
        <label for="trainer-search">Search</label>
        <input
          type="text"
          id="trainer-search"
          value="{{ q|default:'' }}"
          placeholder="Type 2+ characters to search..."
          autocomplete="off"
        >
        <div id="trainer-count" class="small" style="color:var(--muted); margin-top:6px;"></div>
      </div>
    </div>
  </div>

  <div style="height:14px;"></div>

  <div class="card">
    <div id="trainer-results" style="display:flex; flex-direction:column; gap:10px;">
      <p class="help" id="trainer-help">Start typing to search trainers.</p>
    </div>
  </div>

  <script>
    function debounce(fn, ms) {
      let t;
      return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...args), ms);
      };
    }

    const input = document.getElementById("trainer-search");
    const box = document.getElementById("trainer-results");
    const count = document.getElementById("trainer-count");
    const help = document.getElementById("trainer-help");

    const searchUrl = "{% url 'trainer_search_api' %}";
    const detailBase = "/trainers/"; // /trainers/<id>/

    function render(results) {
      box.innerHTML = "";
      count.textContent = results.length ? `${results.length} match(es)` : "";

      if (!results.length) {
        const p = document.createElement("p");
        p.style.color = "var(--muted)";
        p.textContent = "No trainers found.";
        box.appendChild(p);
        return;
      }

      for (const t of results) {
        const row = document.createElement("div");
        row.className = "trainer-row";

        const emailPart = t.email ? ` • ${t.email}` : "";

        row.innerHTML = `
          <div class="trainer-left">
            <div class="trainer-name">
              <a href="${detailBase}${t.id}/">
                ${(t.last_name || "")} ${(t.first_name || "")}
              </a>
            </div>
            <div class="trainer-meta">
              SYSPER ID: ${t.sysper_id}${emailPart}
            </div>
          </div>
          <div style="display:flex; gap:10px; align-items:center;">
            <a class="btn secondary small" href="${detailBase}${t.id}/">View</a>
          </div>
        `;

        box.appendChild(row);
      }
    }

    const doSearch = debounce(async () => {
      const q = input.value.trim();

      if (q.length < 2) {
        count.textContent = "";
        box.innerHTML = "";
        const p = document.createElement("p");
        p.className = "help";
        p.style.color = "var(--muted)";
        p.textContent = "Start typing to search trainers.";
        box.appendChild(p);
        return;
      }

      try {
        const res = await fetch(`${searchUrl}?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        render(data.results || []);
      } catch (e) {
        box.innerHTML = "";
        const p = document.createElement("p");
        p.style.color = "var(--muted)";
        p.textContent = "Search failed. Please try again.";
        box.appendChild(p);
      }
    }, 250);

    input.addEventListener("input", doSearch);

    // If there is already a value (e.g. coming back in browser), auto-search.
    if (input.value.trim().length >= 2) {
      doSearch();
    }
  </script>
{% endblock %}
