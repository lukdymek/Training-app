{% extends "training/base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
  <div class="card" style="max-width:520px; margin:0 auto;">
    <h1 style="margin:0 0 10px;">Register</h1>
    <p class="help" style="margin:0 0 14px;">Enter your company email to receive a verification code.</p>

    <form method="post">
      {% csrf_token %}

      <div class="form-row">
        <label for="id_email">Email address</label>
        <input id="id_email"  name="email"  type="email"  placeholder="you@company.com"  required  style="width:100%; padding:10px 12px; border-radius:12px; border:1px solid var(--border); background:var(--input-bg); color:var(--text);"/>

      </div>

      <div style="margin-top:14px;">
        <button class="btn" style="width:100%; justify-content:center;" type="submit">Send code</button>
      </div>

      <div style="margin-top:12px; text-align:center;">
        <a class="small-link" href="{% url 'login' %}">Back to login</a>
      </div>
    </form>
  </div>
{% endblock %}
