<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Trainer days</title></head>
<body>
<h1>Trainer days per month</h1>

<form method="get">
  <label>Year: <input type="number" name="year" value="{{ year }}"></label>
  <label>Month: <input type="number" name="month" value="{{ month }}" min="1" max="12"></label>
  <button type="submit">Run</button>
</form>

<p>
  <a href="{% url 'report_trainers_export' %}?year={{ year }}&month={{ month }}">Export CSV</a>
</p>

<table border="1" cellpadding="6" cellspacing="0">
  <tr>
    <th>SYSPER ID</th><th>Name</th><th>Total days</th>
  </tr>
  {% for r in rows %}
    <tr>
      <td>{{ r.person__sysper_id }}</td>
      <td>{{ r.person__last_name }} {{ r.person__first_name }}</td>
      <td>{{ r.total_days|default_if_none:"0" }}</td>
    </tr>
  {% empty %}
    <tr><td colspan="3">No trainer records for this month.</td></tr>
  {% endfor %}
</table>

<p><a href="{% url 'reports_home' %}">← Back to reports</a></p>
</body>
</html>
