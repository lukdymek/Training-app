{% load static %}
<!doctype html>
<html lang="en">

  <title>{% block title %}Training App{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'training/styles.css' %}">
</head>
<body>

    <div class="topbar-inner">
      <div class="brand">Training App</div>
      <div class="nav">
        <a href="{% url 'calendar' %}">Calendar</a>
        <a href="{% url 'training_list' %}">Trainings</a>

        <a href="{% url 'trainer_list' %}">Trainers</a>

    </div>

  <div class="container">

</html>
