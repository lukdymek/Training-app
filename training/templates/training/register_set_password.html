{% extends "training/base.html" %}
{% block title %}Set password{% endblock %}

{% block content %}
  <div class="card" style="max-width:520px; margin:0 auto;">
    <h1 style="margin:0 0 10px;">Create password</h1>
    <p class="help" style="margin:0 0 14px;">
      Account: <strong>{{ email }}</strong>
    </p>

    <form method="post">
      {% csrf_token %}

      <div class="form-row">
        <label for="id_password1">Password</label>
        <input id="id_password1" name="password1" type="password" autocomplete="new-password" required>
      </div>

      <div class="form-row">
        <label for="id_password2">Confirm password</label>
        <input id="id_password2" name="password2" type="password" autocomplete="new-password" required>
      </div>

      <div style="margin-top:14px;">
        <button class="btn" style="width:100%; justify-content:center;" type="submit">Create account</button>
      </div>

      <div style="margin-top:12px; text-align:center;">
        <a class="small-link" href="{% url 'login' %}">Back to login</a>
      </div>
    </form>
  </div>
{% endblock %}
