<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Trainings</title>
</head>
<body>
<h1>Trainings</h1>

<p><a href="/admin/training/training/add/">Add training (admin)</a></p>


<ul>
{% for t in trainings %}
  <li>
    <a href="{% url 'training_detail' t.pk %}">
    <strong>{{ t.course_name }}</strong>
</a>
    
    <br>
    {{ t.start_at }} → {{ t.end_at }}<br>
    {{ t.location }} | Capacity: {{ t.capacity }}
  </li>
{% empty %}
  <li>No trainings yet.</li>
{% endfor %}
</ul>

</body>
</html>
