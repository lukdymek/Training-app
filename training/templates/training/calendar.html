{% extends "training/base.html" %}
{% load static %}

{% block title %}Calendar{% endblock %}

{% block content %}
  <!-- FullCalendar via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <style>
    .fc-event-title {
      font-weight: 400 !important;
      }
    .fc-event,
    .fc-event-title,
    .fc-event-main {
      color: #f8f9fa!important;
    }
  .fc-daygrid-event-dot {
    display: none !important;
  }
  .fc-daygrid-event {
    padding-left: 4px !important;
  }

  </style>
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">
      <div>
        <h1 style="margin:0 0 6px;">Calendar</h1>
        <p class="help" style="margin:0;">Browse trainings, filter by subject/location, click a day to create a new training.</p>
      </div>

      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <a class="btn secondary" href="{% url 'training_list' %}">Trainings list</a>
        <a class="btn secondary" href="{% url 'people_list' %}">People</a>
        <a class="btn" href="{% url 'training_create' %}">Add training</a>
      </div>
    </div>

    <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--border);">
      <div style="display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap;">
        <div class="form-row" style="min-width:220px;">
          <label for="subjectFilter">Subject</label>
          <select id="subjectFilter">
            <option value="">All</option>
          </select>
        </div>

        <div class="form-row" style="min-width:220px;">
          <label for="locationFilter">Location</label>
          <select id="locationFilter">
            <option value="">All</option>
          </select>
        </div>

        <button id="clearFilters" type="button" class="btn secondary">Clear</button>
      </div>
    </div>
  </div>

  <div style="height:14px;"></div>

  <div class="card">
    <div id="calendar"></div>
  </div>

  <div id="tooltip" style="
    position: absolute;
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    padding: 10px 12px;
    font-size: 12px;
    z-index: 9999;
    max-width: 340px;
    border-radius: 10px;
    box-shadow: var(--shadow);
  "></div>

  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      const calendarEl = document.getElementById('calendar');
      const tooltip = document.getElementById('tooltip');

      const subjectFilter = document.getElementById('subjectFilter');
      const locationFilter = document.getElementById('locationFilter');
      const clearBtn = document.getElementById('clearFilters');

      function subjectColor(subjectName) {
        if (!subjectName || subjectName === "—") return "";
        let hash = 0;
        for (let i = 0; i < subjectName.length; i++) hash = subjectName.charCodeAt(i) + ((hash << 5) - hash);
        const hue = Math.abs(hash) % 360;
        return `hsl(${hue}, 60%, 55%)`;
      }

      function eventsUrl() {
        const params = new URLSearchParams();
        if (subjectFilter.value) params.set("subject_id", subjectFilter.value);
        if (locationFilter.value) params.set("location", locationFilter.value);
        const qs = params.toString();
        return "{% url 'trainings_json' %}" + (qs ? "?" + qs : "");
      }

      // Load filter options
      const filterResp = await fetch("{% url 'calendar_filters' %}");
      const filterData = await filterResp.json();

      for (const s of filterData.subjects) {
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = s.name;
        subjectFilter.appendChild(opt);
      }

      for (const loc of filterData.locations) {
        const opt = document.createElement("option");
        opt.value = loc;
        opt.textContent = loc;
        locationFilter.appendChild(opt);
      }

      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        displayEventTime: false,
        height: "auto",
        navLinks: true,
        nowIndicator: true,
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },

        dateClick: function(info) {
          window.location.href = "{% url 'training_create' %}" + "?start=" + info.dateStr;
        },

        events: function(fetchInfo, successCallback, failureCallback) {
          fetch(eventsUrl())
            .then(r => r.json())
            .then(data => successCallback(data))
            .catch(err => failureCallback(err));
        },

        eventDidMount: function(info) {
          const subject = info.event.extendedProps.subject;
          const color = subjectColor(subject);
          if (color) {
            info.el.style.backgroundColor = color;
            info.el.style.borderColor = color;
          }

          info.el.addEventListener("mouseenter", () => {
            const p = info.event.extendedProps;
            tooltip.innerHTML = `
              <div style="font-weight:700; margin-bottom:6px;">${info.event.title}</div>
              <div><strong>Subject:</strong> ${p.subject || "—"}</div>
              <div><strong>Location:</strong> ${p.location || "—"}</div>
              <div><strong>Capacity:</strong> ${p.capacity_used ?? 0} / ${p.capacity_total ?? 0}</div>
            `;
            tooltip.style.display = "block";
          });

          info.el.addEventListener("mousemove", (e) => {
            tooltip.style.left = (e.pageX + 12) + "px";
            tooltip.style.top = (e.pageY + 12) + "px";
          });

          info.el.addEventListener("mouseleave", () => {
            tooltip.style.display = "none";
          });
        },

        eventClick: function(info) {
          if (info.event.url) {
            window.location.href = info.event.url;
            info.jsEvent.preventDefault();
          }
        }
      });

      calendar.render();

      function refetch() {
        tooltip.style.display = "none";
        calendar.refetchEvents();
      }

      subjectFilter.addEventListener("change", refetch);
      locationFilter.addEventListener("change", refetch);
      clearBtn.addEventListener("click", () => {
        subjectFilter.value = "";
        locationFilter.value = "";
        refetch();
      });
    });
  </script>
{% endblock %}
