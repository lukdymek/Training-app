{% extends "training/base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
  <style>
    .login-card input[type="text"],
    .login-card input[type="password"]{
      width:100%;
      padding:10px 12px;
      border:1px solid var(--border);
      border-radius:12px;
      background: var(--input-bg);
      color: var(--text);
      outline: none;
    }
    .login-card input[type="text"]:focus,
    .login-card input[type="password"]:focus{
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
    }
    .small-link{
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
    }
    .small-link:hover{
      text-decoration: underline;
    }
    .full-btn{
      width:100%;
      justify-content:center;
    }
  </style>

  <div class="card login-card" style="max-width:520px; margin:0 auto;">
    <h1 style="margin:0 0 10px;">Login</h1>

    {% if messages %}
      <div style="margin-bottom:12px;">
        {% for message in messages %}
          <div style="color:#842029; background:#fde2e1; border:1px solid #f3a6a2; padding:10px; border-radius:12px; margin-bottom:8px;">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <div class="form-row">
        <label for="id_identifier">Email address</label>
        <input
          id="id_identifier"
          name="identifier"
          type="text"
          autocomplete="username"
          placeholder="you@example.com"
          required
        >
      </div>

      <div class="form-row">
        <label for="id_password">Password</label>
        <input
          id="id_password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <div style="margin-top:8px;">
          <a class="small-link" href="/forgot-password/">Forgot password?</a>
        </div>
      </div>

      <div style="margin-top:14px;">
        <button class="btn full-btn" type="submit">Login</button>
      </div>

      <div style="margin-top:12px; text-align:center;">
        <a class="small-link" href="{% url 'register' %}">Register</a>

      </div>
    </form>
  </div>
{% endblock %}
