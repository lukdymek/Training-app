services:
  db:
    image: postgres:16
    container_name: training-db
    environment:
      POSTGRES_DB: training
      POSTGRES_USER: training
      POSTGRES_PASSWORD: training
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U training -d training"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    container_name: training-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: change-me-in-production
      DEBUG: "0"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
      DATABASE_URL: postgres://training:training@db:5432/training
      DEFAULT_FROM_EMAIL: noreply@example.com
    ports:
      - "8000:8000"

volumes:
  postgres_data:
